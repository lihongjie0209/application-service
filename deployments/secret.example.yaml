apiVersion: v1
kind: Secret
metadata:
  name: application-service
  namespace: platform
type: Opaque
stringData:
  # Copy this file outside source control, replace every value, then apply it.
  APP_DATABASE_DSN: postgres://user:password@postgres:5432/platform?sslmode=require&search_path=application
  APP_MIGRATION_DATABASE_URL: postgres://user:password@postgres:5432/platform?sslmode=require&search_path=application
  APP_REDIS_ADDRESS: redis:6379
  APP_REDIS_PASSWORD: replace-me
  APP_JWT_SECRET: replace-with-at-least-32-random-bytes
  APP_AUTH_CLIENT_ID: replace-me
  APP_AUTH_CLIENT_SECRET: replace-me
  # Shared only with services that verify tenant-application grants. Transport remains mTLS.
  APP_AUTH_PSK_KEY: replace-with-at-least-32-random-bytes
  # Operational bootstrap only. Prefer a short-lived service JWT; comma-separate tenant IDs.
  bootstrap_authorization: Bearer replace-with-short-lived-bootstrap-token
  bootstrap_tenant_ids: replace-with-initial-tenant-id
