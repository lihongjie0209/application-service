applications:
  - code: platform-admin
    name: 平台管理
    description: 用户、租户、应用和统一授权管理
    icon: mdi:shield-account-outline
    default_route: /apps/platform-admin/applications
    sort_order: 10
    metadata: {owner: platform}
    menus:
      - {code: applications, name: 应用管理, route: applications, component: platform-admin.applications, permission_code: application.catalog.list, permission_scope: platform, sort_order: 10}
      - {code: applications.read, parent: applications, type: action, name: 查看应用详情, permission_code: application.catalog.read, permission_scope: platform, visible: false, sort_order: 11}
      - {code: applications.create, parent: applications, type: action, name: 创建应用, permission_code: application.catalog.create, permission_scope: platform, visible: false, sort_order: 12}
      - {code: applications.update, parent: applications, type: action, name: 编辑应用, permission_code: application.catalog.update, permission_scope: platform, visible: false, sort_order: 13}
      - {code: menus, name: 菜单管理, route: menus, component: platform-admin.menus, permission_code: application.menu.list, permission_scope: platform, sort_order: 20}
      - {code: menus.update, parent: menus, type: action, name: 编辑菜单, permission_code: application.menu.update, permission_scope: platform, visible: false, sort_order: 21}
      - {code: menus.delete, parent: menus, type: action, name: 删除菜单, permission_code: application.menu.delete, permission_scope: platform, visible: false, sort_order: 22}
      - {code: menus.publish, parent: menus, type: action, name: 发布菜单, permission_code: application.menu.publish, permission_scope: platform, visible: false, sort_order: 23}
      - {code: application-grants, name: 应用授权, route: application-grants, component: platform-admin.application-grants, permission_code: application.grant.list, permission_scope: platform, sort_order: 30}
      - {code: application-grants.grant, parent: application-grants, type: action, name: 授权应用, permission_code: application.grant.grant, permission_scope: platform, visible: false, sort_order: 31}
      - {code: application-grants.revoke, parent: application-grants, type: action, name: 撤销应用授权, permission_code: application.grant.revoke, permission_scope: platform, visible: false, sort_order: 32}
      - {code: tenants, name: 租户管理, route: tenants, component: platform-admin.tenants, permission_code: tenant.profile.list, permission_scope: platform, sort_order: 40}
      - {code: tenants.read, parent: tenants, type: action, name: 查看租户详情, permission_code: tenant.profile.read, permission_scope: platform, visible: false, sort_order: 41}
      - {code: tenants.create, parent: tenants, type: action, name: 创建租户, permission_code: tenant.profile.create, permission_scope: platform, visible: false, sort_order: 42}
      - {code: tenants.update, parent: tenants, type: action, name: 编辑租户, permission_code: tenant.profile.update, permission_scope: platform, visible: false, sort_order: 43}
      - {code: organization-units, name: 组织架构, route: organization-units, component: platform-admin.organization-units, permission_code: tenant.organization-unit.list, permission_scope: tenant, sort_order: 50}
      - {code: organization-units.read, parent: organization-units, type: action, name: 查看组织节点, permission_code: tenant.organization-unit.read, permission_scope: tenant, visible: false, sort_order: 51}
      - {code: organization-units.create, parent: organization-units, type: action, name: 创建组织节点, permission_code: tenant.organization-unit.create, permission_scope: tenant, visible: false, sort_order: 52}
      - {code: organization-units.update, parent: organization-units, type: action, name: 编辑组织节点, permission_code: tenant.organization-unit.update, permission_scope: tenant, visible: false, sort_order: 53}
      - {code: memberships, name: 成员管理, route: memberships, component: platform-admin.memberships, permission_code: tenant.membership.list, permission_scope: tenant, sort_order: 60}
      - {code: memberships.create, parent: memberships, type: action, name: 添加成员, permission_code: tenant.membership.create, permission_scope: tenant, visible: false, sort_order: 61}
      - {code: memberships.update, parent: memberships, type: action, name: 编辑成员, permission_code: tenant.membership.update, permission_scope: tenant, visible: false, sort_order: 62}
      - {code: invitations, name: 邀请管理, route: invitations, component: platform-admin.invitations, permission_code: tenant.invitation.list, permission_scope: tenant, sort_order: 70}
      - {code: invitations.create, parent: invitations, type: action, name: 创建邀请, permission_code: tenant.invitation.create, permission_scope: tenant, visible: false, sort_order: 71}
      - {code: invitations.revoke, parent: invitations, type: action, name: 撤销邀请, permission_code: tenant.invitation.revoke, permission_scope: tenant, visible: false, sort_order: 72}
      - {code: groups, name: 用户组, route: groups, component: platform-admin.groups, permission_code: tenant.group.list, permission_scope: tenant, sort_order: 80}
      - {code: groups.create, parent: groups, type: action, name: 创建用户组, permission_code: tenant.group.create, permission_scope: tenant, visible: false, sort_order: 81}
      - {code: groups.update, parent: groups, type: action, name: 编辑用户组, permission_code: tenant.group.update, permission_scope: tenant, visible: false, sort_order: 82}
      - {code: group-members, name: 用户组成员, route: group-members, component: platform-admin.group-members, permission_code: tenant.group.list-members, permission_scope: tenant, sort_order: 90}
      - {code: group-members.add, parent: group-members, type: action, name: 添加组成员, permission_code: tenant.group.add-member, permission_scope: tenant, visible: false, sort_order: 91}
      - {code: group-members.remove, parent: group-members, type: action, name: 移除组成员, permission_code: tenant.group.remove-member, permission_scope: tenant, visible: false, sort_order: 92}
      - {code: quotas, name: 租户配额, route: quotas, component: platform-admin.quotas, permission_code: tenant.quota.list, permission_scope: tenant, sort_order: 100}
      - {code: quotas.read, parent: quotas, type: action, name: 查看配额详情, permission_code: tenant.quota.read, permission_scope: tenant, visible: false, sort_order: 101}
      - {code: quotas.update, parent: quotas, type: action, name: 设置配额, permission_code: tenant.quota.update, permission_scope: tenant, visible: false, sort_order: 102}
      - {code: quotas.consume, parent: quotas, type: action, name: 消耗配额, permission_code: tenant.quota.consume, permission_scope: tenant, visible: false, sort_order: 103}
      - {code: users, name: 用户管理, route: users, component: platform-admin.users, permission_code: identity.user.list, permission_scope: platform, sort_order: 110}
      - {code: users.create, parent: users, type: action, name: 创建用户, permission_code: identity.user.create, permission_scope: platform, visible: false, sort_order: 111}
      - {code: users.update-status, parent: users, type: action, name: 更新用户状态, permission_code: identity.user.update-status, permission_scope: platform, visible: false, sort_order: 112}
      - {code: users.password-reset, parent: users, type: action, name: 签发密码重置, permission_code: identity.user.password-reset, permission_scope: platform, visible: false, sort_order: 113}
      - {code: users.mfa-reset, parent: users, type: action, name: 重置用户 MFA, permission_code: identity.user.mfa-reset, permission_scope: platform, visible: false, sort_order: 114}
      - {code: service-accounts, name: 服务账号, route: service-accounts, component: platform-admin.service-accounts, permission_code: identity.service-account.list, permission_scope: platform, sort_order: 120}
      - {code: service-accounts.create, parent: service-accounts, type: action, name: 创建服务账号, permission_code: identity.service-account.create, permission_scope: platform, visible: false, sort_order: 121}
      - {code: service-accounts.update-status, parent: service-accounts, type: action, name: 更新服务账号状态, permission_code: identity.service-account.update-status, permission_scope: platform, visible: false, sort_order: 122}
      - {code: sessions, name: 会话管理, route: sessions, component: platform-admin.sessions, permission_code: identity.session.list, permission_scope: platform, sort_order: 130}
      - {code: sessions.revoke, parent: sessions, type: action, name: 撤销会话, permission_code: identity.session.revoke, permission_scope: platform, visible: false, sort_order: 131}
      - {code: roles, name: 角色管理, route: roles, component: platform-admin.roles, permission_code: authorization.role.list, permission_scope: tenant, sort_order: 140}
      - {code: roles.create, parent: roles, type: action, name: 创建角色, permission_code: authorization.role.create, permission_scope: tenant, visible: false, sort_order: 141}
      - {code: roles.update, parent: roles, type: action, name: 编辑角色, permission_code: authorization.role.update, permission_scope: tenant, visible: false, sort_order: 142}
      - {code: permissions, name: 权限管理, route: permissions, component: platform-admin.permissions, permission_code: authorization.permission.list, permission_scope: tenant, sort_order: 150}
      - {code: permissions.create, parent: permissions, type: action, name: 创建权限, permission_code: authorization.permission.create, permission_scope: tenant, visible: false, sort_order: 151}
      - {code: permissions.update, parent: permissions, type: action, name: 编辑权限, permission_code: authorization.permission.update, permission_scope: tenant, visible: false, sort_order: 152}
      - {code: role-permissions, name: 角色权限, route: role-permissions, component: platform-admin.role-permissions, permission_code: authorization.role-permission.list, permission_scope: tenant, sort_order: 160}
      - {code: role-permissions.grant, parent: role-permissions, type: action, name: 授予角色权限, permission_code: authorization.role-permission.grant, permission_scope: tenant, visible: false, sort_order: 161}
      - {code: role-permissions.revoke, parent: role-permissions, type: action, name: 撤销角色权限, permission_code: authorization.role-permission.revoke, permission_scope: tenant, visible: false, sort_order: 162}
      - {code: role-bindings, name: 角色绑定, route: role-bindings, component: platform-admin.role-bindings, permission_code: authorization.binding.list, permission_scope: tenant, sort_order: 170}
      - {code: role-bindings.create, parent: role-bindings, type: action, name: 创建角色绑定, permission_code: authorization.binding.create, permission_scope: tenant, visible: false, sort_order: 171}
      - {code: role-bindings.revoke, parent: role-bindings, type: action, name: 撤销角色绑定, permission_code: authorization.binding.revoke, permission_scope: tenant, visible: false, sort_order: 172}

  - code: audit-center
    name: 审计中心
    description: 当前应用的不可变审计记录查询与导出
    icon: mdi:clipboard-text-clock-outline
    default_route: /apps/audit-center/records
    sort_order: 20
    menus:
      - {code: records, name: 审计记录, route: records, component: audit-center.records, permission_code: audit.record.query, permission_scope: tenant, sort_order: 10}

  - code: config-center
    name: 配置中心
    description: 应用动态配置、审批、发布与回滚
    icon: mdi:tune-variant
    default_route: /apps/config-center/entries
    sort_order: 30
    menus:
      - {code: entries, name: 配置项, route: entries, component: config-center.entries, permission_code: config.entry.list, permission_scope: tenant, sort_order: 10}

  - code: notification-center
    name: 通知中心
    description: 通知模板和投递状态管理
    icon: mdi:bell-outline
    default_route: /apps/notification-center/templates
    sort_order: 40
    menus:
      - {code: templates, name: 通知模板, route: templates, component: notification-center.templates, permission_code: notification.template.list, permission_scope: tenant, sort_order: 10}
      - {code: deliveries, name: 投递记录, route: deliveries, component: notification-center.deliveries, permission_code: notification.delivery.list, permission_scope: tenant, sort_order: 20}

  - code: file-center
    name: 文件中心
    description: 应用文件上传、下载、扫描与生命周期管理
    icon: mdi:folder-multiple-outline
    default_route: /apps/file-center/files
    sort_order: 50
    menus:
      - {code: files, name: 文件管理, route: files, component: file-center.files, permission_code: file.object.list, permission_scope: tenant, sort_order: 10}

  - code: scheduler-center
    name: 调度中心
    description: 应用定时任务与执行记录管理
    icon: mdi:calendar-clock-outline
    default_route: /apps/scheduler-center/jobs
    sort_order: 60
    menus:
      - {code: jobs, name: 定时任务, route: jobs, component: scheduler-center.jobs, permission_code: scheduler.job.list, permission_scope: tenant, sort_order: 10}

  - code: dictionary-center
    name: 数据字典
    description: 静态字典和动态 Provider 统一入口
    icon: mdi:book-open-page-variant-outline
    default_route: /apps/dictionary-center/definitions
    sort_order: 70
    menus:
      - {code: definitions, name: 字典定义, route: definitions, component: dictionary-center.definitions, permission_code: dictionary.definition.list, permission_scope: tenant, sort_order: 10}
      - {code: providers, name: Provider 目录, route: providers, component: dictionary-center.providers, permission_code: dictionary.provider.list, permission_scope: platform, sort_order: 20}

  - code: registry-center
    name: 服务注册中心
    description: 应用层服务实例与租约目录
    icon: mdi:server-network
    default_route: /apps/registry-center/services
    sort_order: 80
    menus:
      - {code: services, name: 服务目录, route: services, component: registry-center.services, permission_code: service_registry.service.list, permission_scope: platform, sort_order: 10}

  - code: swagger-center
    name: API 文档中心
    description: 自动发现并聚合平台 OpenAPI 文档
    icon: mdi:api
    default_route: /apps/swagger-center/documents
    sort_order: 90
    menus:
      - {code: documents, name: API 文档, route: documents, component: swagger-center.documents, permission_code: swagger.document.list, permission_scope: platform, sort_order: 10}

  - code: workflow-center
    name: 工作流中心
    description: 工作流定义、实例与人工任务
    icon: mdi:transit-connection-variant
    default_route: /apps/workflow-center/definitions
    sort_order: 100
    menus:
      - {code: definitions, name: 流程定义, route: definitions, component: workflow-center.definitions, permission_code: workflow.definition.list, permission_scope: tenant, sort_order: 10}
      - {code: instances, name: 流程实例, route: instances, component: workflow-center.instances, permission_code: workflow.instance.list, permission_scope: tenant, sort_order: 20}
      - {code: tasks, name: 我的任务, route: tasks, component: workflow-center.tasks, permission_code: workflow.task.list, permission_scope: tenant, sort_order: 30}

  - code: search-center
    name: 应用搜索
    description: 当前应用内跨域投影搜索
    icon: mdi:magnify
    default_route: /apps/search-center/search
    sort_order: 110
    menus:
      - {code: search, name: 应用搜索, route: search, component: search-center.search, permission_code: search.document.search, permission_scope: tenant, sort_order: 10}

  - code: metering-center
    name: 计量中心
    description: 计量器目录与应用用量查询
    icon: mdi:gauge
    default_route: /apps/metering-center/usage
    sort_order: 120
    menus:
      - {code: meters, name: 计量器, route: meters, component: metering-center.meters, permission_code: metering.meter.list, permission_scope: platform, sort_order: 10}
      - {code: usage, name: 用量查询, route: usage, component: metering-center.usage, permission_code: metering.usage.query, permission_scope: tenant, sort_order: 20}

  - code: billing-center
    name: 计费中心
    description: 套餐、订阅和账单管理
    icon: mdi:credit-card-outline
    default_route: /apps/billing-center/subscriptions
    sort_order: 130
    menus:
      - {code: plans, name: 套餐管理, route: plans, component: billing-center.plans, permission_code: billing.plan.list, permission_scope: platform, sort_order: 10}
      - {code: subscriptions, name: 订阅管理, route: subscriptions, component: billing-center.subscriptions, permission_code: billing.subscription.list, permission_scope: tenant, sort_order: 20}
      - {code: invoices, name: 账单管理, route: invoices, component: billing-center.invoices, permission_code: billing.invoice.list, permission_scope: tenant, sort_order: 30}
      - {code: payments, name: 支付与退款, route: payments, component: billing-center.payments, permission_code: billing.payment.list, permission_scope: tenant, sort_order: 40}

  - code: rule-center
    name: 规则中心
    description: 应用规则版本、发布和执行
    icon: mdi:code-braces
    default_route: /apps/rule-center/rules
    sort_order: 140
    menus:
      - {code: rules, name: 规则管理, route: rules, component: rule-center.rules, permission_code: rule.set.list, permission_scope: tenant, sort_order: 10}

  - code: import-center
    name: 数据导入
    description: 应用级异步数据导入任务
    icon: mdi:database-import-outline
    default_route: /apps/import-center/jobs
    sort_order: 150
    menus:
      - {code: jobs, name: 导入任务, route: jobs, component: import-center.jobs, permission_code: import.job.list, permission_scope: tenant, sort_order: 10}

  - code: export-center
    name: 数据导出
    description: 应用级异步数据导出任务
    icon: mdi:database-export-outline
    default_route: /apps/export-center/jobs
    sort_order: 160
    menus:
      - {code: jobs, name: 导出任务, route: jobs, component: export-center.jobs, permission_code: export.job.list, permission_scope: tenant, sort_order: 10}

  - code: webhook-center
    name: Webhook 中心
    description: 应用 Webhook 订阅与投递管理
    icon: mdi:webhook
    default_route: /apps/webhook-center/subscriptions
    sort_order: 170
    menus:
      - {code: subscriptions, name: Webhook 订阅, route: subscriptions, component: webhook-center.subscriptions, permission_code: webhook.subscription.list, permission_scope: tenant, sort_order: 10}
      - {code: deliveries, name: 投递记录, route: deliveries, component: webhook-center.deliveries, permission_code: webhook.delivery.list, permission_scope: tenant, sort_order: 20}
