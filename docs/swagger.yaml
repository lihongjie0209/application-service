basePath: /
definitions:
  buildinfo.Info:
    properties:
      build_time:
        type: string
      commit:
        type: string
      started_at:
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  health.Dependency:
    properties:
      latency:
        type: string
      status:
        type: string
    type: object
  health.Status:
    properties:
      dependencies:
        additionalProperties:
          $ref: '#/definitions/health.Dependency'
        type: object
      status:
        type: string
    type: object
  httptransport.ApplicationBody:
    properties:
      code:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      default_route:
        type: string
      description:
        type: string
      icon:
        type: string
      id:
        type: string
      metadata_json:
        type: string
      name:
        type: string
      published_release:
        type: integer
      sort_order:
        type: integer
      status:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: integer
    type: object
  httptransport.ApplicationIDRequest:
    properties:
      application_id:
        type: string
    required:
    - application_id
    type: object
  httptransport.ApplicationPageBody:
    properties:
      items:
        items:
          $ref: '#/definitions/httptransport.ApplicationBody'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  httptransport.BatchCheckRequest:
    properties:
      application_ids:
        items:
          type: string
        type: array
      at:
        type: string
      tenant_id:
        type: string
    required:
    - application_ids
    - tenant_id
    type: object
  httptransport.BatchNavigationRequest:
    properties:
      application_ids:
        items:
          type: string
        type: array
    required:
    - application_ids
    type: object
  httptransport.BatchNavigationResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/httptransport.NavigationResponse'
        type: array
    type: object
  httptransport.CreateApplicationRequest:
    properties:
      code:
        type: string
      default_route:
        type: string
      description:
        type: string
      icon:
        type: string
      metadata_json:
        type: object
      name:
        type: string
      sort_order:
        type: integer
    required:
    - code
    - name
    type: object
  httptransport.Decision:
    properties:
      application_id:
        type: string
      granted:
        type: boolean
      reason:
        type: string
    type: object
  httptransport.DeleteMenuRequest:
    properties:
      id:
        type: string
      version:
        type: integer
    required:
    - id
    - version
    type: object
  httptransport.GrantBody:
    properties:
      application_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      entitlements_json:
        type: string
      id:
        type: string
      source:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      valid_from:
        type: string
      valid_until:
        type: string
      version:
        type: integer
    type: object
  httptransport.GrantPageBody:
    properties:
      items:
        items:
          $ref: '#/definitions/httptransport.GrantBody'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  httptransport.GrantRequest:
    properties:
      application_id:
        type: string
      entitlements_json:
        type: object
      expected_version:
        type: integer
      source:
        type: string
      tenant_id:
        type: string
      valid_from:
        type: string
      valid_until:
        type: string
    required:
    - application_id
    - tenant_id
    type: object
  httptransport.IDRequest:
    properties:
      id:
        type: string
    required:
    - id
    type: object
  httptransport.ListApplicationsRequest:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      status:
        type: string
    type: object
  httptransport.ListTenantApplicationsRequest:
    properties:
      active_only:
        type: boolean
      page:
        type: integer
      page_size:
        type: integer
      tenant_id:
        type: string
    required:
    - tenant_id
    type: object
  httptransport.MeResponseBody:
    properties:
      subject:
        type: string
    type: object
  httptransport.MenuBody:
    properties:
      application_id:
        type: string
      code:
        type: string
      component:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      external_url:
        type: string
      i18n_key:
        type: string
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      parent_id:
        type: string
      permission_code:
        type: string
      permission_scope:
        type: string
      release_number:
        type: integer
      route:
        type: string
      sort_order:
        type: integer
      status:
        type: string
      type:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: integer
      visible:
        type: boolean
    type: object
  httptransport.MenuInputBody:
    properties:
      application_id:
        type: string
      code:
        type: string
      component:
        type: string
      external_url:
        type: string
      i18n_key:
        type: string
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      parent_id:
        type: string
      permission_code:
        type: string
      permission_scope:
        type: string
      route:
        type: string
      sort_order:
        type: integer
      type:
        type: string
      visible:
        type: boolean
    required:
    - application_id
    - code
    - name
    - type
    type: object
  httptransport.MenuReleaseBody:
    properties:
      application_id:
        type: string
      comment:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      release_number:
        type: integer
      status:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: integer
    type: object
  httptransport.NavigationResponse:
    properties:
      application:
        $ref: '#/definitions/httptransport.ApplicationBody'
      menus:
        items:
          $ref: '#/definitions/httptransport.MenuBody'
        type: array
      release:
        $ref: '#/definitions/httptransport.MenuReleaseBody'
    type: object
  httptransport.PublishMenusRequest:
    properties:
      application_id:
        type: string
      application_version:
        type: integer
      comment:
        type: string
    required:
    - application_id
    - application_version
    type: object
  httptransport.PublishMenusResponse:
    properties:
      menus:
        items:
          $ref: '#/definitions/httptransport.MenuBody'
        type: array
      release:
        $ref: '#/definitions/httptransport.MenuReleaseBody'
    type: object
  httptransport.Response:
    properties:
      body: {}
      code:
        type: integer
      message:
        type: string
      request_id:
        type: string
    type: object
  httptransport.RevokeGrantRequest:
    properties:
      application_id:
        type: string
      tenant_id:
        type: string
      version:
        type: integer
    required:
    - application_id
    - tenant_id
    - version
    type: object
  httptransport.TenantApplicationsResponse:
    properties:
      applications:
        items:
          $ref: '#/definitions/httptransport.ApplicationBody'
        type: array
      grants:
        $ref: '#/definitions/httptransport.GrantPageBody'
    type: object
  httptransport.UpdateApplicationRequest:
    properties:
      default_route:
        type: string
      description:
        type: string
      icon:
        type: string
      id:
        type: string
      metadata_json:
        type: object
      name:
        type: string
      sort_order:
        type: integer
      status:
        type: string
      version:
        type: integer
    required:
    - id
    - name
    - status
    - version
    type: object
  httptransport.UpsertMenuRequest:
    properties:
      expected_version:
        type: integer
      menu:
        $ref: '#/definitions/httptransport.MenuInputBody'
    required:
    - menu
    type: object
info:
  contact: {}
  description: 'Production-oriented Go Web API scaffold. Application error codes:
    0 success; 10000-19999 common/input; 20000-29999 authentication/authorization;
    30000-39999 business; 50000-59999 infrastructure.'
  title: Go API Template
  version: "1.0"
paths:
  /api/v1/applications/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Application
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.CreateApplicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.ApplicationBody'
              type: object
      security:
      - Bearer: []
      summary: Create an application
      tags:
      - applications
  /api/v1/applications/get:
    post:
      consumes:
      - application/json
      parameters:
      - description: Application ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.IDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.ApplicationBody'
              type: object
      security:
      - Bearer: []
      summary: Get an application
      tags:
      - applications
  /api/v1/applications/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Filters and pagination
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ListApplicationsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.ApplicationPageBody'
              type: object
      security:
      - Bearer: []
      summary: List applications
      tags:
      - applications
  /api/v1/applications/menus/delete:
    post:
      consumes:
      - application/json
      parameters:
      - description: Menu ID and version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.DeleteMenuRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Delete a menu draft with optimistic locking
      tags:
      - menus
  /api/v1/applications/menus/draft/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Application ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ApplicationIDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  items:
                    $ref: '#/definitions/httptransport.MenuBody'
                  type: array
              type: object
      security:
      - Bearer: []
      summary: List menu drafts
      tags:
      - menus
  /api/v1/applications/menus/publish:
    post:
      consumes:
      - application/json
      parameters:
      - description: Application version and comment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.PublishMenusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.PublishMenusResponse'
              type: object
        "409":
          description: 'Code 30009: version conflict'
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Publish an immutable menu release
      tags:
      - menus
  /api/v1/applications/menus/upsert:
    post:
      consumes:
      - application/json
      parameters:
      - description: Menu and expected version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.UpsertMenuRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.MenuBody'
              type: object
      security:
      - Bearer: []
      summary: Create or update a menu draft
      tags:
      - menus
  /api/v1/applications/navigation/batch-get:
    post:
      consumes:
      - application/json
      parameters:
      - description: Application IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.BatchNavigationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.BatchNavigationResponse'
              type: object
      security:
      - Bearer: []
      summary: Get published navigation for multiple granted applications
      tags:
      - menus
  /api/v1/applications/navigation/get:
    post:
      consumes:
      - application/json
      parameters:
      - description: Application ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ApplicationIDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.NavigationResponse'
              type: object
      security:
      - Bearer: []
      summary: Get published application navigation
      tags:
      - menus
  /api/v1/applications/tenant-grants/batch-check:
    post:
      consumes:
      - application/json
      parameters:
      - description: Tenant and application IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.BatchCheckRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  items:
                    $ref: '#/definitions/httptransport.Decision'
                  type: array
              type: object
      security:
      - Bearer: []
      summary: Batch-check tenant application grants
      tags:
      - tenant-applications
  /api/v1/applications/tenant-grants/grant:
    post:
      consumes:
      - application/json
      parameters:
      - description: Tenant application grant
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.GrantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.GrantBody'
              type: object
      security:
      - Bearer: []
      summary: Grant an application to a tenant
      tags:
      - tenant-applications
  /api/v1/applications/tenant-grants/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Tenant and pagination
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ListTenantApplicationsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.TenantApplicationsResponse'
              type: object
      security:
      - Bearer: []
      summary: List applications granted to a tenant
      tags:
      - tenant-applications
  /api/v1/applications/tenant-grants/manage/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Target tenant and pagination
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ListTenantApplicationsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.TenantApplicationsResponse'
              type: object
      security:
      - Bearer: []
      summary: List tenant application grants as a platform administrator
      tags:
      - tenant-applications
  /api/v1/applications/tenant-grants/revoke:
    post:
      consumes:
      - application/json
      parameters:
      - description: Grant version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.RevokeGrantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.GrantBody'
              type: object
      security:
      - Bearer: []
      summary: Revoke a tenant application grant
      tags:
      - tenant-applications
  /api/v1/applications/update:
    post:
      consumes:
      - application/json
      parameters:
      - description: Application and version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.UpdateApplicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.ApplicationBody'
              type: object
        "409":
          description: 'Code 30009: version conflict'
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Update an application with optimistic locking
      tags:
      - applications
  /api/v1/me:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.MeResponseBody'
              type: object
        "401":
          description: 'Code 20001: unauthorized'
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Return the authenticated subject
      tags:
      - authentication
  /api/v1/version:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/buildinfo.Info'
              type: object
      summary: Return build and runtime version information
      tags:
      - operations
  /live:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/health.Status'
              type: object
      summary: Check process liveness
      tags:
      - operations
  /ready:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/health.Status'
              type: object
        "503":
          description: 'Code 50003: dependency unavailable'
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/health.Status'
              type: object
      summary: Check database and Redis readiness
      tags:
      - operations
schemes:
- http
- https
securityDefinitions:
  Bearer:
    description: Enter "Bearer {JWT}".
    in: header
    name: Authorization
    type: apiKey
  PSK:
    description: Enter "PSK {shared-key}" for routes configured with PSK authentication.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
